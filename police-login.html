<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Police Login - Locate Me</title>
<style>
/* ==========================================
   1. GLOBAL STYLES & VARIABLES (Matches Dashboard)
   ========================================== */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
:root {
    --primary: #1e3a8a; --primary-light: #3b82f6; --danger: #dc2626;
    --success: #059669; --dark: #0f172a; --light: #f8fafc; 
    --gray: #64748b; --border: #e2e8f0;
}
body { 
    background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%); 
    min-height: 100vh; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    padding: 20px; 
}

/* ==========================================
   2. LOGIN CARD
   ========================================== */
.login-card {
    background: white; border-radius: 24px; padding: 40px; width: 100%; max-width: 420px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
}
.login-header { text-align: center; margin-bottom: 30px; }
.login-icon {
    width: 70px; height: 70px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    border-radius: 16px; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 15px; font-size: 35px; box-shadow: 0 10px 25px rgba(30, 58, 138, 0.3);
}
.login-header h1 { color: var(--primary); font-size: 24px; font-weight: 700; margin-bottom: 5px; }
.login-header p { color: var(--gray); font-size: 13px; }

/* ==========================================
   3. FORM ELEMENTS
   ========================================== */
.input-group { margin-bottom: 20px; }
.input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--dark); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.input-group input {
    width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 14px; transition: all 0.2s;
}
.input-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1); }

.btn-login {
    width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(30, 58, 138, 0.2); }
.btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

.error-message {
    background: #fee2e2; color: var(--danger); padding: 12px; border-radius: 8px; font-size: 13px;
    margin-bottom: 20px; display: none; text-align: center; border: 1px solid #fecaca;
}
.footer-link { display: block; text-align: center; margin-top: 25px; font-size: 12px; color: var(--gray); text-decoration: none; }
.footer-link:hover { color: var(--primary); }
</style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="login-icon">👮</div>
        <h1>Police Command Center</h1>
        <p>Locate Me - Secure Officer Login</p>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <form onsubmit="handleLogin(event)">
        <div class="input-group">
            <label>Officer Email</label>
            <input type="email" id="email" placeholder="officer@police.go.ke" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">
            <span id="btnText">🔐 Access Dashboard</span>
            <span id="btnSpinner" style="display:none;"> Logging in...</span>
        </button>
    </form>

    <a href="index.html" class="footer-link">← Back to Main App</a>
</div>

<script>
const API_URL = 'https://locate-me-backend-yvs8.onrender.com/api';

// 1. AUTO-LOGIN CHECK (Prevent redirect loop)
window.onload = function() {
    const token = localStorage.getItem('authToken');
    const userStr = localStorage.getItem('user');
    const policeUserStr = localStorage.getItem('policeUser');
    
    // Check if already logged in as police officer
    if (token && (userStr || policeUserStr)) {
        try {
            const user = userStr ? JSON.parse(userStr) : JSON.parse(policeUserStr);
            
            // Verify user is police officer and has station
            if (user.role === 'police' && user.station_id && user.station_id !== 'UNASSIGNED') {
                console.log('✅ Valid police session found. Redirecting to dashboard...');
                window.location.href = 'police-dashboard.html';
                return;
            }
        } catch (e) {
            console.error('Session parse error:', e);
            // Clear invalid session
            localStorage.removeItem('authToken');
            localStorage.removeItem('user');
            localStorage.removeItem('policeUser');
        }
    }
};

// 2. LOGIN HANDLER
async function handleLogin(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorDiv = document.getElementById('errorMessage');

    // Reset UI
    errorDiv.style.display = 'none';
    btn.disabled = true;
    btnText.style.display = 'none';
    btnSpinner.style.display = 'inline';

    try {
        const res = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.error || 'Login failed. Check credentials.');
        }

        // 3. CHECK IF USER IS POLICE OFFICER
        if (data.user.role !== 'police') {
            throw new Error('Access denied. This portal is for police officers only.');
        }

        // 4. CHECK STATION ASSIGNMENT
        if (!data.user.station_id || data.user.station_id === 'UNASSIGNED') {
            throw new Error('Your account is not assigned to a police station. Please contact the Admin.');
        }

        // 5. CACHE DATA (Store in both locations for compatibility)
        localStorage.setItem('authToken', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('policeUser', JSON.stringify(data.user));

        console.log('✅ Login successful. Redirecting to dashboard...');
        window.location.href = 'police-dashboard.html';

    } catch (err) {
        console.error('Login error:', err);
        errorDiv.textContent = '⚠️ ' + err.message;
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
    }
}
</script>
</body>
</html>
